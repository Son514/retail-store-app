name: Build & Push & Deploy

# Builds the deployed service images, pushes them to Amazon ECR, then
# records the resulting image tag in the per-environment Helm values.
# ArgoCD (installed by Terraform) watches the repo and rolls out the
# change -- the runner no longer deploys to the cluster directly.
#
# - push to main → prod image tag updated → ArgoCD deploys to production
# - push to dev  → dev image tag updated    → ArgoCD deploys to development
#
# Image tags use the short git SHA so they are unique per commit -- required
# because ECR repos use immutable tags and disallow overwriting. The tag is
# written into k8s/envs/<env>/<service>-values.yaml and committed back; the
# values files are excluded from the push trigger so that commit does not
# re-trigger the pipeline (no infinite loop).

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'k8s/envs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: build-images
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  # Role created by terraform/environments/oidc (GitHub Actions OIDC).
  DEPLOY_ROLE_ARN: arn:aws:iam::692797214517:role/github-actions-deploy

jobs:
  build-and-push:
    name: Build & push ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [catalog, ui]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v3

      - name: Enable yarn and install dependencies
        run: |
          corepack enable
          yarn install

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GithubActionsSession

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short SHA)
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.project }}
        env:
          IMG_URI: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.project }}
        run: |
          docker build -t "${IMG_URI}:${{ steps.tag.outputs.tag }}" src/${{ matrix.project }}
          docker push "${IMG_URI}:${{ steps.tag.outputs.tag }}"

  update-image-tags:
    name: Update image tags for ArgoCD
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update image tags in env values
        run: |
          NS=${{ (github.ref == 'refs/heads/main') && 'production' || 'development' }}
          TAG=${GITHUB_SHA::7}
          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" \
            k8s/envs/${NS}/catalog-values.yaml \
            k8s/envs/${NS}/ui-values.yaml

      - name: Commit & push image tag
        run: |
          NS=${{ (github.ref == 'refs/heads/main') && 'production' || 'development' }}
          git add k8s/envs/${NS}
          if git diff --cached --quiet; then
            echo "No tag change to commit -- already up to date."
          else
            git commit -m "ci: update ${NS} image tags to ${GITHUB_SHA::7}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
