# Production overrides for the ui chart.
# Anything not listed here inherits the chart defaults in
# k8s/charts/ui/values.yaml.

# HPA controls Deployment.replicas; set baseline to autoscaling.minReplicas.
replicaCount: 3

image:
  # Bump to the latest pushed tag before deploying (ECR tags are immutable).
  tag: "175f87c"

# Scale between 3 and 10 replicas based on CPU/memory utilization.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  RETAIL_UI_THEME: default
  RETAIL_UI_SEARCH_ENABLED: "false"
  RETAIL_UI_ENDPOINTS_CATALOG: http://catalog

# PDB ensures at least 1 pod stays running during Karpenter spot
# disruptions, node consolidation, or voluntary evictions.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 256m
    memory: 512Mi
  limits:
    memory: 768Mi

# Schedule on Karpenter spot nodes for cost savings.
nodeSelector:
  karpenter.sh/capacity-type: spot
tolerations: []

# Soft-spread pods across AZs (best effort, never blocks scheduling).
topologySpreadConstraints:
  - maxSkew: 2
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ui

# Traces -> ADOT collector -> AWS X-Ray.
opentelemetry:
  enabled: true
