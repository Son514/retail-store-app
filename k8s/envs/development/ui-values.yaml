# Development overrides for the ui chart.
# Anything not listed here inherits the chart defaults in
# k8s/charts/ui/values.yaml.

replicaCount: 1

image:
  # Bootstrap tag = the production build at branch creation; CI rewrites it
  # to the short SHA on each push to dev (ECR tags are immutable).
  tag: "175f87c"

config:
  RETAIL_UI_THEME: default
  RETAIL_UI_SEARCH_ENABLED: "false"
  RETAIL_UI_ENDPOINTS_CATALOG: http://catalog

# PDB disabled in dev — single replica cannot tolerate any disruption.
podDisruptionBudget:
  enabled: false

# Traces -> ADOT collector -> AWS X-Ray.
opentelemetry:
  enabled: true
