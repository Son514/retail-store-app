# Development overrides for the catalog chart.
# Anything not listed here inherits the chart defaults in
# k8s/charts/catalog/values.yaml.

replicaCount: 1

image:
  tag: "1.0"

# PDB disabled in dev — single replica cannot tolerate any disruption.
podDisruptionBudget:
  enabled: false

# Traces -> ADOT collector -> AWS X-Ray.
opentelemetry:
  enabled: true
