# Default values for the ui chart.
# Deployed to the EKS cluster provisioned by ../../terraform.

replicaCount: 1

image:
  repository: 692797214517.dkr.ecr.ap-southeast-1.amazonaws.com/ui
  tag: "1.0"
  pullPolicy: IfNotPresent

containerPort: 8080

javaOpts: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"

config:
  RETAIL_UI_THEME: default
  RETAIL_UI_SEARCH_ENABLED: "false"
  RETAIL_UI_ENDPOINTS_CATALOG: http://catalog

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

securityContext:
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 10

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  requests:
    cpu: 128m
    memory: 512Mi
  limits:
    memory: 512Mi

# Node placement — override per environment to target spot or on-demand.
nodeSelector: {}
tolerations: []

# Rolling update strategy — maxSurge: 0 ensures old pods terminate before new
# ones are created, preventing memory overcommit on capacity-constrained nodes.
strategy:
  maxSurge: 0
  maxUnavailable: 1
