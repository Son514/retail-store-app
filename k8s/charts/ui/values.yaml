# Default values for the ui chart.
# Deployed to the EKS cluster provisioned by ../../terraform.

replicaCount: 1

image:
  repository: 692797214517.dkr.ecr.ap-southeast-1.amazonaws.com/ui
  tag: "1.0"
  pullPolicy: IfNotPresent

containerPort: 8080

javaOpts: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"

config:
  RETAIL_UI_THEME: default
  RETAIL_UI_SEARCH_ENABLED: "false"
  RETAIL_UI_ENDPOINTS_CATALOG: http://catalog

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

securityContext:
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 10

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10

resources:
  requests:
    cpu: 128m
    memory: 512Mi
  limits:
    memory: 512Mi
