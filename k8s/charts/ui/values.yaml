# Default values for the ui chart.
# Deployed to the EKS cluster provisioned by ../../terraform.

replicaCount: 1

image:
  repository: 692797214517.dkr.ecr.ap-southeast-1.amazonaws.com/ui
  tag: "1.0"
  pullPolicy: IfNotPresent

containerPort: 8080

javaOpts: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"

config:
  RETAIL_UI_THEME: default
  RETAIL_UI_SEARCH_ENABLED: "false"
  RETAIL_UI_ENDPOINTS_CATALOG: http://catalog

service:
  type: ClusterIP
  port: 80
  # Prometheus scrape annotations discovered by the ADOT collector's
  # 'retail-apps' scrape job (k8s service/endpoints SD). ui exposes its
  # Prometheus metrics at /actuator/prometheus (Spring Boot Micrometer).
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

securityContext:
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 10

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 30
  periodSeconds: 10

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  requests:
    cpu: 128m
    memory: 512Mi
  limits:
    memory: 512Mi

# Node placement — override per environment to target spot or on-demand.
nodeSelector: {}
tolerations: []

# Pod topology spread — override per environment to distribute across AZs.
topologySpreadConstraints: []

# Horizontal Pod Autoscaler — controls Deployment.replicas when enabled.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: ""

# OpenTelemetry tracing — export OTLP traces to the ADOT collector, which
# forwards to AWS X-Ray. Enabled per environment via the values override.
opentelemetry:
  enabled: false
  # Collector service DNS (see k8s/observability/service.yaml).
  endpoint: http://adot-collector.aws-otel-eks:4318
  serviceName: ui
  # Java agent autoconfiguration: enables the OTel Java SDK via
  # OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED so traces flow with no app change.
  javaAutoconfigure: true

# Rolling update strategy — maxSurge: 0 ensures old pods terminate before new
# ones are created, preventing memory overcommit on capacity-constrained nodes.
strategy:
  maxSurge: 0
  maxUnavailable: 1
