apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ui.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "ui.name" . }}
    app.kubernetes.io/owner: retail-store-sample
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
