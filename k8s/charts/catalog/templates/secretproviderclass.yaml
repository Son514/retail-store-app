apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretProviderClass.name }}
  namespace: {{ .Release.Namespace }}
spec:
  provider: {{ .Values.secretProviderClass.provider }}
  parameters:
    usePodIdentity: {{ .Values.secretProviderClass.usePodIdentity | quote }}
    region: {{ .Values.secretProviderClass.region }}
    objects: |
      - objectName: {{ .Values.secretProviderClass.secretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
        {{- range .Values.secretProviderClass.keys }}
          - path: {{ . | quote }}
            objectAlias: {{ . | quote }}
        {{- end }}
