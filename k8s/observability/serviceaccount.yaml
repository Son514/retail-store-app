apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-otel-collector
  namespace: aws-otel-eks
---
# The collector uses the awsXRay exporter to write traces to AWS X-Ray.
# The IAM_role is set via the Terraform-managed EKS Pod Identity association
# (role "eks-adot-collector" with AWSXRayDaemonWriteAccess) targeting this
# exact service account / namespace — see terraform/modules/eks/main.tf.
