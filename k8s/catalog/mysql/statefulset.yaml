apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: development
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/owner: retail-store-sample
spec:
  replicas: 1
  serviceName: mysql
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/owner: retail-store-sample
    spec:
      serviceAccountName: mysql-sa
      containers:
        - name: mysql
          image: public.ecr.aws/docker/library/mysql:8.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              export MYSQL_ROOT_PASSWORD=$(cat /mnt/secrets/MYSQL_ROOT_PASSWORD)
              export MYSQL_USER=$(cat /mnt/secrets/RETAIL_CATALOG_PERSISTENCE_USER)
              export MYSQL_PASSWORD=$(cat /mnt/secrets/RETAIL_CATALOG_PERSISTENCE_PASSWORD)
              exec docker-entrypoint.sh mysqld
          env:
            - name: MYSQL_DATABASE
              value: catalogdb
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: catalog-db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ebs-gp3
        resources:
          requests:
            storage: 10Gi
